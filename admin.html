<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body onload="guardAdmin()">
  <div id="admin-content" style="display:none;">
    <!-- Copie aqui todo o conteúdo da página Dashboard original (entre <div class=\"app\"> … </div>) -->
    <!-- Apenas a parte de dashboard será exibida após autenticação -->
    <!-- Exemplo simplificado – você pode colar o markup original aqui -->
    <div class="app">
      <header class="topbar">
        <a class="topbar-logo" href="#">Lumix Fibra CS2</a>
        <nav class="topbar-nav" role="navigation" aria-label="Navegação principal">
          <button class="nav-btn" onclick="showPage('dashboard')" id="nav-dashboard">Dashboard</button>
          <button class="nav-btn" onclick="showPage('register')" id="nav-register">Inscrição</button>
          <button class="nav-btn" onclick="showPage('teams')" id="nav-teams">Times</button>
          <button class="nav-btn" onclick="showPage('bracket')" id="nav-bracket">Chave</button>
        </nav>
        <div class="topbar-actions">
          <button class="btn btn-ghost" onclick="requestNotifications()">🔔 Notificações</button>
          <button class="theme-toggle" data-theme-toggle aria-label="Alternar tema"></button>
        </div>
      </header>

      <main class="main-content">
        <!-- Dashboard - mesma estrutura que já existia -->
        <div class="page active" id="page-dashboard">
          <!-- aqui vai o conteúdo original da dashboard (cards, stats, etc.) -->
        </div>
        <!-- demais páginas (register, teams, bracket) permanecem aqui, mas ficam ocultas -->
        <div class="page" id="page-register"></div>
        <div class="page" id="page-teams"></div>
        <div class="page" id="page-bracket"></div>
      </main>
    </div>
    <button onclick="logout()" class="btn btn-secondary" style="position:fixed;top:1rem;right:1rem;">Sair</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function guardAdmin() {
      auth.onAuthStateChanged(user => {
        if (user) {
          document.getElementById('admin-content').style.display = 'block';
        } else {
          location.href = 'login.html';
        }
      });
    }
  </script>
</body>
</html>
