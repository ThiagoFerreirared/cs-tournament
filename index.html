<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Torneio Lumix Fibra CS2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@300..700&display=swap" rel="stylesheet">

    /* ... todo o CSS igual ao seu ... */
  </style>
</head>
<body>
  <div class="card">
    <!-- logo igual -->

    <div class="form-group">
      <label class="form-label" for="login-user">Usuário</label>
      <input class="form-input" id="login-user" type="text" placeholder="thiago" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label" for="login-pass">Senha</label>
      <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="login-error">Usuário ou senha incorretos.</div>
    <button class="btn" onclick="doLogin()">Entrar</button>

    <div class="divider"></div>
    <div class="link-row">
      <a href="public.html">👁 Acompanhar como visitante</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/auth.js"></script>
</body>
