<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Torneio Lumix Fibra CS2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg:#0d0e10; --color-surface:#141518; --color-surface-2:#1a1b1f;
      --color-border:#2e3038; --color-text:#e2e4ec; --color-text-muted:#7a7d8a;
      --color-primary:#ff4d2e; --color-primary-hover:#e03f22;
      --color-error:#e04060; --color-success:#4caf6e;
      --font-display:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif;
      --radius-md:.5rem; --radius-lg:.75rem; --radius-xl:1rem;
      --shadow-lg:0 12px 32px oklch(0 0 0 / 0.5);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-font-smoothing:antialiased; }
    body {
      min-height:100dvh; font-family:var(--font-body); background:var(--color-bg);
      color:var(--color-text); display:flex; align-items:center; justify-content:center;
      padding:1.5rem;
      background-image: radial-gradient(ellipse at 20% 50%, oklch(from #ff4d2e l c h / 0.07) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, oklch(from #ff4d2e l c h / 0.04) 0%, transparent 50%);
    }
    .card {
      background:var(--color-surface); border:1px solid var(--color-border);
      border-radius:var(--radius-xl); padding:2.5rem 2rem;
      max-width:380px; width:100%; box-shadow:var(--shadow-lg);
    }
    .logo {
      display:flex; flex-direction:column; align-items:center; gap:.75rem;
      margin-bottom:2rem; text-align:center;
    }
    .logo-icon {
      width:52px; height:52px; border-radius:var(--radius-lg);
      background: linear-gradient(135deg, var(--color-primary), #ff7a5c);
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 4px 16px oklch(from #ff4d2e l c h / 0.4);
    }
    .logo-icon svg { color:#fff; }
    .logo h1 { font-family:var(--font-display); font-size:1.6rem; font-weight:700; letter-spacing:.04em; line-height:1.1; }
    .logo p { font-size:.8rem; color:var(--color-text-muted); margin-top:.25rem; }
    .form-group { display:flex; flex-direction:column; gap:.5rem; margin-bottom:1rem; }
    .form-label { font-size:.82rem; font-weight:600; color:var(--color-text); }
    .form-input {
      background:var(--color-surface-2); border:1px solid var(--color-border);
      border-radius:var(--radius-md); padding:.75rem 1rem;
      font-size:.95rem; color:var(--color-text); font-family:var(--font-body);
      transition: border-color .18s, box-shadow .18s;
      width:100%;
    }
    .form-input:focus { outline:none; border-color:var(--color-primary); box-shadow:0 0 0 3px oklch(from #ff4d2e l c h / 0.15); }
    .form-input::placeholder { color:#3d404a; }
    .btn {
      width:100%; padding:.85rem; border-radius:var(--radius-md);
      background:var(--color-primary); color:#fff; font-family:var(--font-display);
      font-size:1.1rem; font-weight:700; letter-spacing:.04em;
      border:none; cursor:pointer; margin-top:.5rem;
      transition: background .18s, transform .1s, box-shadow .18s;
      box-shadow: 0 4px 14px oklch(from #ff4d2e l c h / 0.35);
    }
    .btn:hover { background:var(--color-primary-hover); transform:translateY(-1px); }
    .btn:active { transform:translateY(0); }
    .divider { height:1px; background:var(--color-border); margin:1.25rem 0; }
    .link-row { text-align:center; font-size:.82rem; color:var(--color-text-muted); }
    .link-row a { color:var(--color-primary); text-decoration:none; font-weight:600; }
    .link-row a:hover { text-decoration:underline; }
    #login-error { font-size:.8rem; color:var(--color-error); margin-top:.5rem; display:none; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
          <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="14" cy="14" r="4" fill="currentColor"/>
          <line x1="14" y1="6" x2="14" y2="10" stroke="currentColor" stroke-width="2"/>
          <line x1="14" y1="18" x2="14" y2="22" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <h1>Lumix Fibra CS2</h1>
        <p>Painel de Administração</p>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="login-user">Usuário</label>
      <input class="form-input" id="login-user" type="text" placeholder="" 
    </div>
    <div class="form-group">
      <label class="form-label" for="login-pass">Senha</label>
      <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="login-error">E-mail ou senha incorretos.</div>
    <button class="btn" onclick="doLogin()">Entrar</button>

    <div class="divider"></div>
    <div class="link-row">
      <a href="public.html">👁 Acompanhar como visitante</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function doLogin() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      const err = document.getElementById('login-error');
      err.style.display = 'none';
      firebase.auth().signInWithEmailAndPassword(email, pass)
        .then(() => { window.location.href = 'index.html'; })
        .catch(() => { err.style.display = 'block'; });
    }
    document.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
